<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Directory Page</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url("BYD%20Dolphin%202024%20Service%20Manual%20English/BYD%20Dolphin%20Maintenance%20Manual/image/2024-dolphin.jpeg") no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      position: relative; /* for reference if needed */
    }
    .container {
      text-align: center;
      background: rgba(0, 0, 0, 0.6);
      padding: 40px;
      border-radius: 15px;
      max-width: 600px;
      z-index: 1;
    }
    h1 {
      font-size: 2.8em;
      margin-bottom: 20px;
    }
    a {
      display: block;
      margin: 12px 0;
      font-size: 1.4em;
      text-decoration: none;
      color: #00d0ff;
      transition: color 0.3s;
    }
    a:hover {
      color: #ffffff;
    }
    /* Move shop-link to bottom right */
    .shop-link {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(0,0,0,0.7);
      padding: 10px 15px;
      border-radius: 10px;
      font-size: 0.9em;
      color: #ffe600;
      max-width: 280px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      z-index: 10;
      line-height: 1.3;
      font-weight: 600;
      user-select: none;
    }
    .shop-link a {
      color: #ff9800;
      text-decoration: underline;
      font-weight: 700;
      user-select: text;
    }
    .shop-link a:hover {
      color: #ffffff;
    }
  </style>
</head>
